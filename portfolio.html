<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Biblioteca de Videojuegos Pro</title>
  <style>
    /* ESTILOS VISUALES (CSS) */
    :root {
      --bg-color: #121214;
      --card-bg: #202024;
      --text-color: #e1e1e6;
      --text-muted: #8d8d99;
      --primary: #8257e5;
      --primary-hover: #9466ff;
      --danger: #f75a68;
      --success: #00b37e;
      --warning: #e1ba15;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .dashboard-container {
      width: 100%;
      max-width: 1000px;
    }

    h1 {
      text-align: center;
      color: var(--primary);
      margin-bottom: 30px;
    }

    /* Formulario de añadir juego */
    .game-form {
      display: flex;
      gap: 12px;
      margin-bottom: 30px;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .game-form input, .game-form select, .game-form button {
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      background: #121214;
      color: var(--text-color);
      outline: none;
    }

    .game-form input {
      flex: 2;
      border: 1px solid #29292e;
    }

    .game-form input:focus {
      border-color: var(--primary);
    }

    .game-form select {
      flex: 1;
      cursor: pointer;
      border: 1px solid #29292e;
    }

    .game-form button {
      background: var(--primary);
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .game-form button:hover {
      background: var(--primary-hover);
    }

    /* Columnas de listas */
    .lists-wrapper {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .lists-wrapper {
        grid-template-columns: 1fr;
      }
    }

    .list-column {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      min-height: 400px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .list-column h3 {
      margin-top: 0;
      padding-bottom: 10px;
      border-bottom: 2px solid #29292e;
      display: flex;
      justify-content: space-between;
    }

    .games-list {
      margin-top: 15px;
    }

    /* Tarjetas de juego */
    .game-card {
      display: flex;
      flex-direction: column;
      background: #121214;
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 6px;
      border-left: 4px solid var(--primary);
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .game-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .game-card span.title {
      font-weight: bold;
      word-break: break-word;
      font-size: 16px;
    }

    .game-details {
      margin-top: 8px;
      font-size: 13px;
      color: var(--text-muted);
      border-top: 1px dashed #29292e;
      padding-top: 8px;
    }

    .game-details p {
      margin: 4px 0;
    }

    .actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .actions button {
      cursor: pointer;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 14px;
      transition: transform 0.1s, background 0.2s;
    }

    .actions button:hover {
      transform: scale(1.05);
    }

    .btn-check { background-color: var(--success); color: white; }
    .btn-return { background-color: var(--warning); color: #121214; }
    .btn-edit { background-color: #29292e; color: var(--text-color); }
    .btn-edit:hover { background-color: #323238; }
    .btn-delete { background-color: rgba(247, 90, 104, 0.15); color: var(--danger); }
    .btn-delete:hover { background-color: var(--danger); color: white; }

    /* VENTANA MODAL (Formulario flotante de edición) */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 25px;
      border-radius: 8px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .modal-content h3 {
      margin-top: 0;
      color: var(--primary);
    }

    .modal-group {
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .modal-group label {
      font-size: 14px;
      color: var(--text-muted);
    }

    .modal-group input, .modal-group textarea {
      padding: 10px;
      background: #121214;
      border: 1px solid #29292e;
      color: var(--text-color);
      border-radius: 6px;
      font-size: 15px;
      outline: none;
    }

    .modal-group input:focus, .modal-group textarea:focus {
      border-color: var(--primary);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-actions button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-save { background: var(--primary); color: white; }
    .btn-cancel { background: #29292e; color: var(--text-color); }
  </style>
</head>
<body>

  <div class="dashboard-container">
    <h1>🎮 Mi Panel de Videojuegos</h1>
    
    <!-- Formulario para añadir juegos -->
    <form id="game-form" class="game-form">
      <input type="text" id="game-title" placeholder="¿Qué juego quieres apuntar?" required>
      <select id="game-status">
        <option value="pendiente">Pendiente ⏳</option>
        <option value="jugado">Jugado ✅</option>
      </select>
      <button type="submit">Añadir</button>
    </form>

    <!-- Contenedores de las listas -->
    <div class="lists-wrapper">
      <div class="list-column">
        <h3>⏳ Pendientes <span id="count-pendiente" style="color: gray; font-size: 14px;">0</span></h3>
        <div id="list-pendiente" class="games-list"></div>
      </div>
      
      <div class="list-column">
        <h3>✅ Jugados <span id="count-jugado" style="color: gray; font-size: 14px;">0</span></h3>
        <div id="list-jugado" class="games-list"></div>
      </div>
    </div>
  </div>

  <!-- VENTANA EMERGENTE (MODAL) PARA EDITAR DETALLES -->
  <div id="edit-modal" class="modal-overlay">
    <div class="modal-content">
      <h3>Editar Información</h3>
      <form id="edit-form">
        <input type="hidden" id="edit-game-id">
        
        <div class="modal-group">
          <label for="edit-game-hours">Horas jugadas:</label>
          <input type="number" id="edit-game-hours" min="0" placeholder="Ej: 45">
        </div>

        <div class="modal-group">
          <label for="edit-game-comment">Comentario o Reseña:</label>
          <textarea id="edit-game-comment" rows="4" placeholder="¿Qué te pareció el juego o por dónde vas?"></textarea>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="closeModal()">Cancelar</button>
          <button type="submit" class="btn-save">Guardar Cambios</button>
        </div>
      </form>
    </div>
  </div>

  <!-- LÓGICA EN JAVASCRIPT -->
  <script>
    const gameForm = document.getElementById('game-form');
    const gameTitleInput = document.getElementById('game-title');
    const gameStatusInput = document.getElementById('game-status');
    const listPendiente = document.getElementById('list-pendiente');
    const listJugado = document.getElementById('list-jugado');
    const countPendiente = document.getElementById('count-pendiente');
    const countJugado = document.getElementById('count-jugado');

    // Elementos del Modal
    const editModal = document.getElementById('edit-modal');
    const editForm = document.getElementById('edit-form');
    const editGameId = document.getElementById('edit-game-id');
    const editGameHours = document.getElementById('edit-game-hours');
    const editGameComment = document.getElementById('edit-game-comment');

    // Recuperar datos de LocalStorage o crear un array vacío
    let games = JSON.parse(localStorage.getItem('myGamesList')) || [];

    // Función para renderizar los juegos e interfaz
    function renderGames() {
        listPendiente.innerHTML = '';
        listJugado.innerHTML = '';
        
        let cPendiente = 0;
        let cJugado = 0;

        games.forEach(game => {
            const gameCard = document.createElement('div');
            gameCard.classList.add('game-card');
            
            if (game.status === 'jugado') {
                gameCard.style.borderLeftColor = 'var(--success)';
            }

            // Detectar si tiene horas o comentarios guardados para mostrarlos
            const hasHours = game.hours !== undefined && game.hours !== '';
            const hasComment = game.comment && game.comment.trim() !== '';
            
            let detailsHTML = '';
            if (hasHours || hasComment) {
                detailsHTML = `<div class="game-details">`;
                if (hasHours) detailsHTML += `<p>⏱️ <strong>Horas:</strong> ${game.hours}h</p>`;
                if (hasComment) detailsHTML += `<p>💬 <strong>Nota:</strong> ${game.comment}</p>`;
                detailsHTML += `</div>`;
            }

            gameCard.innerHTML = `
                <div class="game-card-header">
                    <span class="title">${game.title}</span>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Espacio Personal</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-dark: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-purple: #818cf8;
            --accent-pink: #f472b6;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 40px 20px;
            line-height: 1.5;
        }

        .dashboard-container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
        }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(to right, var(--accent-purple), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }

        @media (max-width: 900px) {
            .grid-layout { grid-template-columns: 1fr; }
        }

        .panel {
            background-color: var(--card-dark);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h2 {
            font-size: 1.4rem;
            margin-bottom: 20px;
        }

        .week-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .day-card {
            background: #111827;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }

        .day-name {
            font-weight: 700;
            color: var(--accent-purple);
            margin-bottom: 8px;
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        .day-task {
            font-size: 0.9rem;
            color: var(--text-muted);
            min-height: 40px;
            outline: none;
            padding: 4px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            background-color: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
        }

        .btn-add {
            background-color: var(--accent-purple);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .game-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .game-item {
            background: #111827;
            border: 1px solid var(--border);
            padding: 14px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-delete {
            background: transparent;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .future-badge {
            background: rgba(244, 114, 182, 0.15);
            color: var(--accent-pink);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <header>
            <h1>Mi Espacio Personal</h1>
            <p style="color: var(--text-muted)">Organización semanal y seguimiento de videojuegos.</p>
        </header>

        <main>
            <!-- Planificación Semanal -->
            <section class="panel" style="margin-bottom: 30px;">
                <h2>📅 Planificación de la Semana</h2>
                <div class="week-container">
                    <div class="day-card"><div class="day-name">Lunes</div><div class="day-task" contenteditable="true" id="task-lunes"></div></div>
                    <div class="day-card"><div class="day-name">Martes</div><div class="day-task" contenteditable="true" id="task-martes"></div></div>
                    <div class="day-card"><div class="day-name">Miércoles</div><div class="day-task" contenteditable="true" id="task-miercoles"></div></div>
                    <div class="day-card"><div class="day-name">Jueves</div><div class="day-task" contenteditable="true" id="task-jueves"></div></div>
                    <div class="day-card"><div class="day-name">Viernes</div><div class="day-task" contenteditable="true" id="task-viernes"></div></div>
                    <div class="day-card"><div class="day-name">Sábado</div><div class="day-task" contenteditable="true" id="task-sabado"></div></div>
                    <div class="day-card"><div class="day-name">Domingo</div><div class="day-task" contenteditable="true" id="task-domingo"></div></div>
                </div>
            </section>

            <div class="grid-layout">
                <!-- Juegos por terminar -->
                <section class="panel">
                    <h2>🎮 Juegos Pendientes</h2>
                    <div class="input-group">
                        <input type="text" id="current-game-input" placeholder="Añadir juego pendiente...">
                        <button class="btn-add" id="btn-add-current">Añadir</button>
                    </div>
                    <ul class="game-list" id="current-games-list"></ul>
                </section>

                <!-- Juegos futuros -->
                <section class="panel">
                    <h2>🚀 Próximos Juegos</h2>
                    <div class="input-group">
                        <input type="text" id="future-game-input" placeholder="Añadir juego futuro...">
                        <button class="btn-add" id="btn-add-future">Añadir</button>
                    </div>
                    <ul class="game-list" id="future-games-list"></ul>
                </section>
            </div>
        </main>
    </div>

    <script>
        // Forzar la creación de las bases de datos si no existen
        if (localStorage.getItem('currentGames') === null) {
            localStorage.setItem('currentGames', JSON.stringify(['Elden Ring', 'Cyberpunk 2077']));
        }
        if (localStorage.getItem('futureGames') === null) {
            localStorage.setItem('futureGames', JSON.stringify(['GTA VI']));
        }

        const days = ['lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado', 'domingo'];

        // Cargar datos de la memoria
        function getGames(type) {
            return JSON.parse(localStorage.getItem(type + 'Games')) || [];
        }

        // Guardar datos en la memoria
        function saveGames(type, array) {
            localStorage.setItem(type + 'Games', JSON.stringify(array));
        }

        // Pintar listas en la pantalla
        function updateUI(type) {
            const listElement = document.getElementById(type + '-games-list');
            const games = getGames(type);
            listElement.innerHTML = '';

            games.forEach((game, index) => {
                const li = document.createElement('li');
                li.className = 'game-item';
                if (type === 'current') {
                    li.innerHTML = `<span>${game}</span><button class="btn-delete" data-index="${index}">✕ Terminado</button>`;
                } else {
                    li.innerHTML = `<span>${game}</span><span class="future-badge" data-index="${index}">✕ Quitar</span>`;
                }
                listElement.appendChild(li);
            });
        }

        // Procesar nuevo juego
        function handleAdd(type) {
            const input = document.getElementById(type + '-game-input');
            const name = input.value.trim();
            if (!name) return;

            const games = getGames(type);
            games.push(name);
            saveGames(type, games);
            input.value = '';
            updateUI(type);
        }

        // Procesar eliminación de juego
        function handleDelete(type, index) {
            const games = getGames(type);
            games.splice(index, 1);
            saveGames(type, games);
            updateUI(type);
        }

        // Escuchadores de eventos para los botones de añadir
        document.getElementById('btn-add-current').addEventListener('click', () => handleAdd('current'));
        document.getElementById('btn-add-future').addEventListener('click', () => handleAdd('future'));

        // Eventos para borrar juegos haciendo clic en la lista
        document.getElementById('current-games-list').addEventListener('click', (e) => {
            if (e.target.classList.contains('btn-delete')) {
                handleDelete('current', e.target.getAttribute('data-index'));
            }
        });

        document.getElementById('future-games-list').addEventListener('click', (e) => {
            if (e.target.classList.contains('future-badge')) {
                handleDelete('future', e.target.getAttribute('data-index'));
            }
        });

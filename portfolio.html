<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Biblioteca de Juegos</title>
  <style>
    /* ESTILOS VISUALES (CSS) */
    :root {
      --bg-color: #121214;
      --card-bg: #202024;
      --text-color: #e1e1e6;
      --primary: #8257e5;
      --primary-hover: #9466ff;
      --danger: #f75a68;
      --success: #00b37e;
      --warning: #e1ba15;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .dashboard-container {
      width: 100%;
      max-width: 900px;
    }

    h1 {
      text-align: center;
      color: var(--primary);
      margin-bottom: 30px;
    }

    /* Formulario de añadir juego */
    .game-form {
      display: flex;
      gap: 12px;
      margin-bottom: 30px;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .game-form input, .game-form select, .game-form button {
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      background: #121214;
      color: var(--text-color);
      outline: none;
    }

    .game-form input {
      flex: 2;
      border: 1px solid #29292e;
    }

    .game-form input:focus {
      border-color: var(--primary);
    }

    .game-form select {
      flex: 1;
      cursor: pointer;
      border: 1px solid #29292e;
    }

    .game-form button {
      background: var(--primary);
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .game-form button:hover {
      background: var(--primary-hover);
    }

    /* Columnas de listas */
    .lists-wrapper {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 600px) {
      .lists-wrapper {
        grid-template-columns: 1fr;
      }
    }

    .list-column {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      min-height: 400px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .list-column h3 {
      margin-top: 0;
      padding-bottom: 10px;
      border-bottom: 2px solid #29292e;
      display: flex;
      justify-content: space-between;
    }

    .games-list {
      margin-top: 15px;
    }

    /* Tarjetas de juego */
    .game-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #121214;
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 6px;
      border-left: 4px solid var(--primary);
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .game-card span {
      font-weight: 500;
      word-break: break-word;
      margin-right: 10px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .actions button {
      cursor: pointer;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 14px;
      transition: transform 0.1s, opacity 0.2s;
    }

    .actions button:hover {
      transform: scale(1.05);
    }

    .btn-check { background-color: var(--success); color: white; }
    .btn-return { background-color: var(--warning); color: #121214; }
    .btn-delete { background-color: rgba(247, 90, 104, 0.2); color: var(--danger); }
    .btn-delete:hover { background-color: var(--danger); color: white; }
  </style>
</head>
<body>

  <div class="dashboard-container">
    <h1>🎮 Mi Panel de Videojuegos</h1>
    
    <!-- Formulario para añadir juegos -->
    <form id="game-form" class="game-form">
      <input type="text" id="game-title" placeholder="¿Qué juego quieres apuntar?" required>
      <select id="game-status">
        <option value="pendiente">Pendiente ⏳</option>
        <option value="jugado">Jugado ✅</option>
      </select>
      <button type="submit">Añadir</button>
    </form>

    <!-- Contenedores de las listas -->
    <div class="lists-wrapper">
      <div class="list-column">
        <h3>⏳ Pendientes <span id="count-pendiente" style="color: gray; font-size: 14px;">0</span></h3>
        <div id="list-pendiente" class="games-list"></div>
      </div>
      
      <div class="list-column">
        <h3>✅ Jugados <span id="count-jugado" style="color: gray; font-size: 14px;">0</span></h3>
        <div id="list-jugado" class="games-list"></div>
      </div>
    </div>
  </div>

  <!-- LÓGICA EN JAVASCRIPT -->
  <script>
    const gameForm = document.getElementById('game-form');
    const gameTitleInput = document.getElementById('game-title');
    const gameStatusInput = document.getElementById('game-status');
    const listPendiente = document.getElementById('list-pendiente');
    const listJugado = document.getElementById('list-jugado');
    const countPendiente = document.getElementById('count-pendiente');
    const countJugado = document.getElementById('count-jugado');

    // Recuperar datos de LocalStorage o crear un array vacío
    let games = JSON.parse(localStorage.getItem('myGamesList')) || [];

    // Función para renderizar los juegos e interfaz
    function renderGames() {
        listPendiente.innerHTML = '';
        listJugado.innerHTML = '';
        
        let cPendiente = 0;
        let cJugado = 0;

        games.forEach(game => {
            const gameCard = document.createElement('div');
            gameCard.classList.add('game-card');
            
            // Personalizar el borde izquierdo según el estado
            if (game.status === 'jugado') {
                gameCard.style.borderLeftColor = 'var(--success)';
            }

            gameCard.innerHTML = `
                <span>${game.title}</span>
                <div class="actions">
                    ${game.status === 'pendiente' 
                        ? `<button onclick="toggleStatus(${game.id})" class="btn-check" title="Marcar como jugado">✓</button>` 
                        : `<button onclick="toggleStatus(${game.id})" class="btn-return" title="Mover a pendientes">↺</button>`
                    }
                    <button onclick="deleteGame(${game.id})" class="btn-delete" title="Eliminar">✕</button>
                </div>
            `;

            if (game.status === 'pendiente') {
                listPendiente.appendChild(gameCard);
                cPendiente++;
            } else {
                listJugado.appendChild(gameCard);
                cJugado++;
            }
        });

        // Actualizar los contadores numéricos de las cabeceras
        countPendiente.textContent = cPendiente;
        countJugado.textContent = cJugado;
    }

    // Escuchar el envío del formulario
    gameForm.addEventListener('submit', (e) => {
        e.preventDefault();

        const newGame = {
            id: Date.now(),
            title: gameTitleInput.value.trim(),
            status: gameStatusInput.value
        };

        games.push(newGame);
        saveAndReload();
        gameForm.reset();
    });

    // Cambiar estado del juego (Pendiente <-> Jugado)
    function toggleStatus(id) {
        games = games.map(game => {
            if (game.id === id) {
                game.status = game.status === 'pendiente' ? 'jugado' : 'pendiente';
            }
            return game;
        });
        saveAndReload();
    }

    // Eliminar juego
    function deleteGame(id) {
        if(confirm("¿Seguro que quieres eliminar este juego?")) {
            games = games.filter(game => game.id !== id);
            saveAndReload();
        }
    }

    // Guardar en LocalStorage y refrescar vista
    function saveAndReload() {
        localStorage.setItem('myGamesList', JSON.stringify(games));
        renderGames();
    }

    // Carga inicial
    renderGames();
  </script>
</body>
</html>
